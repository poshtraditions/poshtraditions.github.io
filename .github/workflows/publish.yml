name: Publish Posh Traditions

on:
  push:
    paths:
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check out the public site
        uses: actions/checkout@v4

      - name: Bring in the finished site
        run: |
          curl --fail --location "https://662b6aa8716440.lhr.life/posh-intro-update.zip" --output /tmp/posh-site.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -q /tmp/posh-site.zip -d .

      - name: Save the public site files
        run: |
          git config user.name "Posh Traditions Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add the ship and treasure intro" || echo "No source changes"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the live site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish the live site
        uses: actions/deploy-pages@v4
