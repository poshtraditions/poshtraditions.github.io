name: Publish Posh Traditions

on:
  push:
    paths:
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check out the public site
        uses: actions/checkout@v4

      - name: Install the always-on phone intro
        run: |
          mkdir -p about assets
          printf '%s' '' | base64 --decode | gzip --decompress > 'index.html'
          printf '%s' '' | base64 --decode | gzip --decompress > 'about/index.html'
          printf '%s' '' | base64 --decode | gzip --decompress > 'assets/index-Zkz7pS-7.css'
          printf '%s' '' | base64 --decode | gzip --decompress > 'assets/index-eE86tOMN.js'
          printf '%s' '' | base64 --decode | gzip --decompress > 'assets/layout-segment-context-DkOSz712.js'
          printf '%s' '' | base64 --decode | gzip --decompress > 'assets/page-DXrWVucW.js'

      - name: Save the public site files
        run: |
          git config user.name "Posh Traditions Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Make the intro play on every phone visit" || echo "No source changes"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the live site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish the live site
        uses: actions/deploy-pages@v4
